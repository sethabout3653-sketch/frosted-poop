<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="frost" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer container with rounded corners and border -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#27272a" stroke-width="1.5"/>

  <!-- Frosted geometric crystal / snowflake -->
  <g filter="url(#glow)" stroke="url(#frost)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main 6-axis crystal lines -->
    <line x1="32" y1="14" x2="32" y2="50"/>
    <line x1="16.4" y1="23" x2="47.6" y2="41"/>
    <line x1="16.4" y1="41" x2="47.6" y2="23"/>

    <!-- Crystal branches -->
    <!-- Vertical top -->
    <path d="M27 19 L32 24 L37 19"/>
    <!-- Vertical bottom -->
    <path d="M27 45 L32 40 L37 45"/>
    <!-- Top-left -->
    <path d="M19 28 L25 28 L23 21"/>
    <!-- Bottom-right -->
    <path d="M45 36 L39 36 L41 43"/>
    <!-- Bottom-left -->
    <path d="M19 36 L25 36 L23 43"/>
    <!-- Top-right -->
    <path d="M45 28 L39 28 L41 21"/>
  </g>

  <!-- Center core diamond -->
  <polygon points="32,27 37,32 32,37 27,32" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
</svg>
